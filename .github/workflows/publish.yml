name: Publish NuGet Packages

on:
  push:
    branches:
      - master

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Get latest version tag
        id: latest_tag
        run: |
          # Get the latest version tag, default to v0.0.0 if none exists
          LATEST_TAG=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG"
        shell: bash

      - name: Determine version bump from branch name
        id: bump
        run: |
          # Get the branch name from merge commit message
          # Format: "Merge pull request #123 from user/feat/branch-name"
          # Or: "Merge branch 'feat/branch-name'"
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"
          
          # Extract branch name from merge commit
          if [[ "$COMMIT_MSG" =~ from\ [^/]+/([^[:space:]]+) ]]; then
            BRANCH="${BASH_REMATCH[1]}"
          elif [[ "$COMMIT_MSG" =~ Merge\ branch\ \'([^\']+)\' ]]; then
            BRANCH="${BASH_REMATCH[1]}"
          else
            BRANCH=""
          fi
          echo "Detected branch: $BRANCH"
          
          # Determine bump type
          if [[ "$BRANCH" =~ ^(breaking|major)/ ]]; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" =~ ^(feat|feature)/ ]]; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" =~ ^(fix|bugfix|patch)/ ]]; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          else
            echo "Branch doesn't match version bump pattern, skipping release"
            echo "bump=none" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Calculate new version
        id: version
        if: steps.bump.outputs.bump != 'none'
        run: |
          LATEST="${{ steps.latest_tag.outputs.tag }}"
          BUMP="${{ steps.bump.outputs.bump }}"
          
          # Remove 'v' prefix and split into parts
          VERSION="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          
          # Calculate new version
          case "$BUMP" in
            major)
              NEW_VERSION="$((MAJOR + 1)).0.0"
              ;;
            minor)
              NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
              ;;
            patch)
              NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              ;;
          esac
          
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bump: $BUMP | $LATEST -> v$NEW_VERSION"
        shell: bash

      - name: Update version in csproj files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # Update HappyPath.csproj
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" HappyPath/HappyPath.csproj
          
          # Update HappyPath.AwesomeAssertions.csproj
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|" integrations/HappyPath.AwesomeAssertions/HappyPath.AwesomeAssertions.csproj
          
          echo "Updated csproj files to version $VERSION"
        shell: bash

      - name: Restore dependencies
        if: steps.bump.outputs.bump != 'none'
        run: dotnet restore

      - name: Build
        if: steps.bump.outputs.bump != 'none'
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        if: steps.bump.outputs.bump != 'none'
        run: dotnet test --configuration Release --no-build

      - name: Pack NuGet packages
        if: steps.bump.outputs.bump != 'none'
        run: dotnet pack --configuration Release --no-build -p:PackageVersion=${{ steps.version.outputs.version }} -o ./artifacts

      - name: List artifacts (debug)
        if: steps.bump.outputs.bump != 'none'
        run: ls -la ./artifacts

      - name: Publish to NuGet.org
        if: steps.bump.outputs.bump != 'none'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          echo "Pushing packages to NuGet.org..."
          dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create and push git tag
        if: steps.bump.outputs.bump != 'none'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Commit updated csproj files
        if: steps.bump.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git add HappyPath/HappyPath.csproj integrations/HappyPath.AwesomeAssertions/HappyPath.AwesomeAssertions.csproj
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin master
          echo "Committed version bump to master"
